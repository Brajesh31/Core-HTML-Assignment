name: "🐛 Bug report"
description: Report a reproducible issue in an assignment page or repository documentation.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Use synthetic examples and sanitized screenshots. Do not post credentials or private personal information."
  - type: input
    id: file
    attributes:
      label: Affected file
      placeholder: "Assignment_2_Core html/questionN.html"
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: Problem summary
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and version
  - type: input
    id: viewport
    attributes:
      label: Viewport dimensions
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized evidence
      description: Attach only safe screenshots/logs. Do not include private data.
