name: Update README timestamp

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 1"

permissions:
  contents: write

concurrency:
  group: readme-timestamp
  cancel-in-progress: true

jobs:
  update-readme:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Update timestamp
        run: |
          DATE=$(date -u +"%Y-%m-%d %H:%M UTC")
          TIMESTAMP_LINE="Last updated: $DATE"
          if grep -q "^Last updated:" README.md; then
            sed -i "s/^Last updated:.*/$TIMESTAMP_LINE/" README.md
          else
            printf "\n%s\n" "$TIMESTAMP_LINE" >> README.md
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --cached --quiet; then
            echo "README timestamp is already current."
            exit 0
          fi
          git commit -m "chore: refresh README timestamp"
          git push origin HEAD:main
